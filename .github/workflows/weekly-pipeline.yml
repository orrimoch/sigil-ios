# Sigil Weekly Scoring Pipeline
# Runs every Sunday at 04:00 UTC (06:00 Israel, 11:00 PM EST Saturday)
# Fetches market data and calculates composite scores

name: Weekly Scoring Pipeline

"on":
  schedule:
    # Saturday 23:00 UTC = Sunday 01:00 Israel (matches original cron)
    - cron: '0 23 * * 6'
  
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - scores-only
          - test
      stocks:
        description: 'Number of stocks (test mode only)'
        required: false
        default: '10'
        type: string

env:
  PYTHON_VERSION: '3.11'
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  SENTIMENT_MODEL: 'llm'
  LLM_MODEL: 'claude-3-haiku-20240307'

jobs:
  run-pipeline:
    name: Run Scoring Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Determine pipeline mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            echo "stocks=${{ inputs.stocks }}" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "stocks=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Run pipeline
        working-directory: backend
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          STOCKS="${{ steps.mode.outputs.stocks }}"
          
          echo "🚀 Running pipeline in $MODE mode..."
          
          if [ "$MODE" == "test" ]; then
            python -m src.cli.run_pipeline full --test --stocks "$STOCKS"
          elif [ "$MODE" == "scores-only" ]; then
            python -m src.cli.run_pipeline scores-only
          else
            python -m src.cli.run_pipeline full
          fi
      
      - name: Validate outputs
        working-directory: backend
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          echo "✅ Validating pipeline outputs..."
          
          if [ "$MODE" == "test" ]; then
            echo "⚠️ Skipping strict validation in test mode"
            # Just check file exists
            if [ -f "data/composite_scores.json" ]; then
              echo "✅ composite_scores.json exists"
            else
              echo "❌ composite_scores.json missing"
              exit 1
            fi
          else
            python -m src.cli.run_pipeline validate
          fi
      
      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add data files
          git add backend/data/composite_scores.json || true
          git add backend/data/fundamentals.json || true
          git add backend/data/macro.json || true
          git add backend/data/news.json || true
          git add backend/data/score_history.json || true
          git add backend/data/pipeline_logs/ || true
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): weekly pipeline update [skip ci]
            
            - Updated composite scores
            - Refreshed fundamentals and macro data
            - Pipeline run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      
      - name: Upload pipeline logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: backend/data/pipeline_logs/
          retention-days: 30

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: run-pipeline
    if: failure()
    
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Weekly Pipeline Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `
            ## Pipeline Failure Alert
            
            **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Triggered by:** ${{ github.event_name }}
            **Time:** ${new Date().toISOString()}
            
            Please investigate the failure and re-run if needed.
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'pipeline']
            });
