name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Run unit tests
        working-directory: backend
        run: python -m pytest tests/unit/ -v --tb=short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      
      - name: Run integration tests
        working-directory: backend
        run: python -m pytest tests/integration/ -v --tb=short
        if: github.event_name == 'push'

  ios-build:
    runs-on: macos-14
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app
      
      - name: Build iOS app
        working-directory: ios/TradingApp
        run: |
          xcodebuild build \
            -project TradingApp.xcodeproj \
            -scheme TradingApp \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      
      - name: Run iOS tests
        working-directory: ios/TradingApp
        run: |
          xcodebuild test \
            -project TradingApp.xcodeproj \
            -scheme TradingApp \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
        if: github.event_name == 'push'

  auto-tag:
    runs-on: ubuntu-latest
    needs: [backend-tests, ios-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version from commit
        id: version
        run: |
          # Check if commit message contains version bump
          if git log -1 --pretty=%B | grep -qE "^(feat|fix|refactor).*:.*v[0-9]+\.[0-9]+\.[0-9]+"; then
            VERSION=$(git log -1 --pretty=%B | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_tag=true" >> $GITHUB_OUTPUT
          else
            echo "should_tag=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create tag
        if: steps.version.outputs.should_tag == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a ${{ steps.version.outputs.version }} -m "Release ${{ steps.version.outputs.version }}"
          git push origin ${{ steps.version.outputs.version }}
