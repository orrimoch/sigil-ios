# Sigil HMM Regime Model Training
# Runs weekly on Sunday at 04:00 UTC (06:00 Israel)
# Trains Hidden Markov Model for market regime detection

name: HMM Regime Training

"on":
  schedule:
    # Every Sunday at 04:00 UTC = 06:00 Israel
    - cron: '0 4 * * 0'
  
  workflow_dispatch:
    inputs:
      force:
        description: 'Force retraining even if model is fresh'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  train-hmm:
    name: Train HMM Model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Train HMM model
        working-directory: backend
        run: |
          echo "🧠 Training HMM regime model..."
          python -m src.cli.run_pipeline train-hmm
      
      - name: Verify model
        working-directory: backend
        run: |
          echo "✅ Verifying HMM model..."
          python -c "
          from pathlib import Path
          import pickle
          
          model_path = Path('data/models/hmm_regime_model.pkl')
          if model_path.exists():
              print(f'✓ Model exists ({model_path.stat().st_size} bytes)')
              with open(model_path, 'rb') as f:
                  model = pickle.load(f)
              print(f'✓ Model loaded successfully')
              if hasattr(model, 'n_components'):
                  print(f'✓ States: {model.n_components}')
          else:
              raise FileNotFoundError('HMM model not found!')
          "
      
      - name: Commit updated model
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add backend/data/models/hmm_regime_model.pkl
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(model): weekly HMM regime model update [skip ci]
            
            - Retrained on latest SPY/VIX data
            - Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
