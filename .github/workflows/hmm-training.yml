# Sigil HMM Regime Model Training
# Runs monthly on first Sunday at 18:00 UTC (20:00 Israel)
# Trains Hidden Markov Model for market regime detection

name: HMM Regime Training

"on":
  schedule:
    # First Sunday of month at 18:00 UTC = 20:00 Israel
    - cron: '0 18 1-7 * 0'
  
  workflow_dispatch:
    inputs:
      force:
        description: 'Force retraining even if model is fresh'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  check-schedule:
    name: Check if First Sunday
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    
    steps:
      - name: Check if first Sunday of month
        id: check
        run: |
          DAY=$(date +%d)
          DOW=$(date +%u)  # 7 = Sunday
          
          # Run if day <= 7 AND it's Sunday, OR if manually triggered
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Manual trigger - will run"
          elif [ "$DAY" -le 7 ] && [ "$DOW" -eq 7 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "First Sunday of month - will run"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Not first Sunday - skipping"
          fi

  train-hmm:
    name: Train HMM Model
    runs-on: ubuntu-latest
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Train HMM model
        working-directory: backend
        run: |
          echo "🧠 Training HMM regime model..."
          python -m src.cli.run_pipeline train-hmm
      
      - name: Verify model
        working-directory: backend
        run: |
          echo "✅ Verifying HMM model..."
          python -c "
          from pathlib import Path
          import pickle
          
          model_path = Path('data/models/hmm_regime_model.pkl')
          if model_path.exists():
              print(f'✓ Model exists ({model_path.stat().st_size} bytes)')
              with open(model_path, 'rb') as f:
                  model = pickle.load(f)
              print(f'✓ Model loaded successfully')
              if hasattr(model, 'n_components'):
                  print(f'✓ States: {model.n_components}')
          else:
              raise FileNotFoundError('HMM model not found!')
          "
      
      - name: Get current regime
        working-directory: backend
        run: |
          python -c "
          from src.risk.hmm_regime import HMMRegimeDetector
          detector = HMMRegimeDetector()
          regime = detector.get_current_regime()
          print(f'📊 Current regime: {regime.get(\"regime\", \"unknown\")}')
          print(f'   Confidence: {regime.get(\"confidence\", 0):.1%}')
          "
      
      - name: Commit updated model
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add backend/data/models/hmm_regime_model.pkl
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(model): monthly HMM regime model update [skip ci]
            
            - Retrained on latest SPY/VIX data
            - Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
