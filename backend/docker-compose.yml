version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    volumes:
      - ./src:/app/src          # Hot reload
      - ./data:/app/data        # Persist cache
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

