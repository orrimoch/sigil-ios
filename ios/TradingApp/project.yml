name: TradingApp
options:
  bundleIdPrefix: com.sigil
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  TradingApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "Info.plist"
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sigil.ios
        PRODUCT_NAME: Sigil
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: Sources/TradingApp.entitlements
      properties: {}
    capabilities:
      backgroundModes:
        modes:
          - fetch
          - processing
    info:
      path: Sources/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - com.sigil.ios.scoreRefresh
          - com.sigil.ios.dataProcessing
        UIBackgroundModes:
          - fetch
          - processing
        CFBundleURLTypes:
          - CFBundleURLName: "com.sigil.ios"
            CFBundleURLSchemes:
              - "sigil"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        NSFaceIDUsageDescription: "Sigil uses Face ID to unlock the app and protect your portfolio."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  TradingAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        type: group
    dependencies:
      - target: TradingApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sigil.ios.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sigil.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sigil"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TradingApp:
    build:
      targets:
        TradingApp: all
        TradingAppTests: [test]
    test:
      targets:
        - TradingAppTests
    run:
      config: Debug
