# Sigil Crowd Wisdom Data Fetcher
# Runs every Saturday at 22:00 UTC (Sunday 00:00 Israel)
# Fetches Reddit trending stocks and insider trading data

name: Crowd Wisdom Fetch

"on":
  schedule:
    # Saturday 22:00 UTC = Sunday 00:00 Israel (before main pipeline)
    - cron: '0 22 * * 6'
  
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of insider data to fetch'
        required: false
        default: '30'
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  fetch-crowd-wisdom:
    name: Fetch Crowd Wisdom Data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Fetch insider trading data
        working-directory: backend
        run: |
          echo "🔍 Fetching insider trading data..."
          python -m src.cli.run_pipeline crowd-wisdom
      
      - name: Verify data
        working-directory: backend
        run: |
          echo "✅ Verifying crowd wisdom data..."
          python -c "
          import json
          from pathlib import Path
          
          db_path = Path('data/crowd_wisdom.db')
          if db_path.exists():
              print(f'✓ crowd_wisdom.db exists ({db_path.stat().st_size} bytes)')
          else:
              print('⚠ crowd_wisdom.db not found')
          "
      
      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add backend/data/crowd_wisdom.db || true
          git add backend/data/reddit_viral_scores.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): crowd wisdom update [skip ci]
            
            - Updated insider trading data
            - Refreshed Reddit trending stocks
            - Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crowd-wisdom-logs-${{ github.run_id }}
          path: backend/data/crowd_wisdom.db
          retention-days: 14
